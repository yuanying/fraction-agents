# The Wiki keeper's files as ConfigMaps, for deploy/agents/wiki-keeper. They are generated here because kustomize
# reads files only from under a kustomization's own directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: wiki-keeper-agent-dir
    files:
      - AGENTS.md
      - settings.json
  # Made-up values. The environment's overlay replaces the whole ConfigMap (behavior: replace).
  - name: wiki-keeper-config
    files:
      - config.json=config.example.json
      - github-gate.json=github-gate.example.json
