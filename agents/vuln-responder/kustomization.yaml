# vuln-responder's files as ConfigMaps, for deploy/agents/vuln-responder. They are generated here because kustomize
# reads files only from under a kustomization's own directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: vuln-responder-agent-dir
    files:
      - AGENTS.md
      - settings.json
  # Example values. The environment's overlay replaces the whole ConfigMap (behavior: replace).
  - name: vuln-responder-config
    files:
      - config.json=config.example.json
      - github-writer.json=github-writer.example.json
