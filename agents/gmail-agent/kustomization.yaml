# The Gmail agent's files as ConfigMaps, for deploy/agents/gmail-agent. They are generated here because kustomize
# reads files only from under a kustomization's own directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: gmail-agent-agent-dir
    files:
      - AGENTS.md
      - settings.json
  # Made-up values. The environment's overlay replaces the whole ConfigMap (behavior: replace).
  - name: gmail-agent-config
    files:
      - config.json=config.example.json
      - gmail.json=gmail.example.json
