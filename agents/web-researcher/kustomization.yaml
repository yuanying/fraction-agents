# The web researcher's files as ConfigMaps, for deploy/agents/web-researcher. They are generated here because
# kustomize reads files only from under a kustomization's own directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: web-researcher-agent-dir
    files:
      - AGENTS.md
      - settings.json
  # Made-up values. The environment's overlay replaces the whole ConfigMap (behavior: replace).
  - name: web-researcher-config
    files:
      - config.json=config.example.json
      - web-research.json=web-research.example.json
