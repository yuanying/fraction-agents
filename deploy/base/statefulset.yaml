apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent
spec:
  # One pod at a time: the volume is ReadWriteOnce, and the host keeps its state in SQLite on it.
  # With one replica, an update deletes the old pod before it creates the new one.
  replicas: 1
  # The Service in front of the agent. Not headless: nothing calls the pod by its own DNS name, and one Service
  # is enough for the callers and the Ingress.
  serviceName: agent
  selector:
    matchLabels:
      app.kubernetes.io/name: fraction-agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraction-agents
    spec:
      serviceAccountName: agent
      securityContext:
        # The image's node user. fsGroup makes the volume writable for it.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The agent directory and the data directory are subpaths of one volume. Create them as the node user,
        # before the kubelet would create them as root for the subPath mounts.
        - name: prepare-volume
          image: ghcr.io/yuanying/fraction-agents
          command: ["sh", "-c", "mkdir -p /volume/agent /volume/data && chmod 700 /volume/agent /volume/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /volume
      containers:
        - name: host
          image: ghcr.io/yuanying/fraction-agents
          args: ["--config", "/etc/fraction-agents/config.json"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The agent directory stays writable: the login writes auth.json there (ADR 0008).
            # The agent's own files come from a ConfigMap, one file at a time.
            - name: data
              mountPath: /agent
              subPath: agent
            - name: agent-dir
              mountPath: /agent/AGENTS.md
              subPath: AGENTS.md
              readOnly: true
            - name: agent-dir
              mountPath: /agent/settings.json
              subPath: settings.json
              readOnly: true
            - name: data
              mountPath: /data
              subPath: data
            - name: config
              mountPath: /etc/fraction-agents/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: agent-dir
          configMap:
            name: agent-dir
        - name: config
          configMap:
            name: agent-config
  # Holds the agent directory (auth.json from the login) and the host's data. The claim is data-<name>-0.
  # No storageClassName: the environment's overlay picks it. The templates cannot be changed once the StatefulSet exists.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
