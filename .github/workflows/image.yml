# The generic host's image. A tag v<version> pushes ghcr.io/yuanying/fraction-agents:<version>;
# a pull request only builds it.
name: image

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Name the image
        id: name
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "tag=ghcr.io/yuanying/fraction-agents:${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=fraction-agents:pr" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.name.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
