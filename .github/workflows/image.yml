# The images: the generic host (ghcr.io/yuanying/fraction-agents), the web researcher's, which adds a browser
# (ghcr.io/yuanying/fraction-agents-web-researcher, the Dockerfile's web-researcher target), and the news agent's,
# which adds the page reader (ghcr.io/yuanying/fraction-agents-news-agent, the news-agent target), and the deep
# researcher's, which adds the page reader and fd (ghcr.io/yuanying/fraction-agents-deep-researcher, the
# deep-researcher target). A tag v<version> pushes all of them as <version>; a pull request only builds them, in a job
# that cannot write packages.
# release.yml calls this with a version as well: a tag pushed by its GITHUB_TOKEN starts no workflow, so it pushes
# the images itself, from the commit it is about to tag, before the tag exists (ADR 0024). That commit is given as ref,
# since a run started by a merged pull request is not on it (ADR 0029).
# test.yml calls this with main on every push to main, once the tests pass: all of them are pushed as main, and the
# versions that tag leaves untagged are deleted (ADR 0026). Every pushed image carries the source repository and the
# commit it was built from as OCI labels.
name: image

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: The version to push the images as (v1.2.3), or main.
        type: string
        required: true
      ref:
        description: The commit to build, when it is not the one the run is on.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    # release.yml calls this from a closed pull request as well; that only publishes.
    if: github.event_name == 'pull_request' && inputs.version == ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: fraction-agents
            target: host
          - image: fraction-agents-web-researcher
            target: web-researcher
          - image: fraction-agents-news-agent
            target: news-agent
          - image: fraction-agents-deep-researcher
            target: deep-researcher
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: ${{ matrix.image }}:pr
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish:
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: fraction-agents
            target: host
          - image: fraction-agents-web-researcher
            target: web-researcher
          - image: fraction-agents-news-agent
            target: news-agent
          - image: fraction-agents-deep-researcher
            target: deep-researcher
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Name the image
        id: name
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          IMAGE: ${{ matrix.image }}
        run: echo "tag=ghcr.io/yuanying/${IMAGE}:${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.name.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Moving main leaves the version it pointed at untagged. The action deletes untagged images together with their
  # platform manifests and attestations, and never a tagged image or what a tagged image refers to. It is not safe to
  # run twice at once against the same package.
  cleanup:
    needs: publish
    if: inputs.version == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-cleanup
      cancel-in-progress: false
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: fraction-agents,fraction-agents-web-researcher,fraction-agents-news-agent,fraction-agents-deep-researcher
          delete-untagged: true
          validate: true
