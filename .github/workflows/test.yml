name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Render the manifests
        run: |
          kubectl kustomize deploy/base > /dev/null
          kubectl kustomize deploy/agents/wiki-keeper > /dev/null
          kubectl kustomize deploy/agents/web-researcher > /dev/null
          kubectl kustomize deploy/agents/gmail-agent > /dev/null
          kubectl kustomize deploy/agents/news-agent > /dev/null
          kubectl kustomize deploy/agents/deep-researcher > /dev/null
