name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Render the manifests
        run: |
          kubectl kustomize deploy/base > /dev/null
          kubectl kustomize deploy/agents/wiki-keeper > /dev/null
          kubectl kustomize deploy/agents/web-researcher > /dev/null
          kubectl kustomize deploy/agents/gmail-agent > /dev/null
          kubectl kustomize deploy/agents/news-agent > /dev/null
          kubectl kustomize deploy/agents/deep-researcher > /dev/null
          kubectl kustomize deploy/agents/vuln-responder > /dev/null
          kubectl kustomize deploy/examples/github-writer > /dev/null

  # main is pushed only from a commit whose tests passed, and one push to main at a time, so that main ends up on the
  # latest commit (ADR 0026).
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: image-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: main
